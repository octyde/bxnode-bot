# BXNode Bot Configuration Example
# Copy this file to config.yaml and fill in your values

server:
  host: "0.0.0.0"
  port: 3000
  cors: true

agents:
  defaults:
    model: "anthropic/claude-3-opus"
    # image_model: "openai/gpt-4-vision"

# Channel configurations (uncomment to enable)
channels:
  # telegram:
  #   token: "YOUR_BOT_TOKEN"
  #   allowed_users: []  # Empty = allow all

  # discord:
  #   token: "YOUR_BOT_TOKEN"
  #   allowed_guilds: []

  # slack:
  #   bot_token: "xoxb-YOUR-BOT-TOKEN"
  #   app_token: "xapp-YOUR-APP-TOKEN"

  # line:
  #   channel_access_token: "YOUR_CHANNEL_ACCESS_TOKEN"
  #   channel_secret: "YOUR_CHANNEL_SECRET"
  #   allowed_users: []  # Empty = allow all

  # signal:
  #   api_url: "http://localhost:8080"  # signal-cli-rest-api URL
  #   phone_number: "+1234567890"
  #   allowed_numbers: []  # Empty = allow all

  # feishu:
  #   app_id: "YOUR_APP_ID"
  #   app_secret: "YOUR_APP_SECRET"
  #   verification_token: "YOUR_VERIFICATION_TOKEN"
  #   allowed_users: []  # Empty = allow all

# Provider configurations
providers:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    # base_url: "https://api.anthropic.com"  # Optional

  openai:
    api_key: "${OPENAI_API_KEY}"
    # base_url: "https://api.openai.com"  # Optional
    # organization: "org-xxx"  # Optional

  ollama:
    base_url: "http://localhost:11434"

# Cron scheduler configuration
cron:
  # Enable/disable the cron scheduler
  enabled: true
  # Path to persistent job store
  store_path: "~/.bxnode-bot/cron.json"
  # Jobs defined in config (persistent jobs managed via CLI)
  jobs: []
    # Example job - runs daily at 9 AM UTC
    # - id: "daily-summary"
    #   schedule: "0 0 9 * * *"  # 6-field cron: sec min hour day month weekday
    #   payload:
    #     action: "generate-summary"
    #   description: "Daily morning summary"
    #   enabled: true

# Memory configuration (long-term memory for agents)
memory:
  # Enable/disable the memory system
  enabled: true
  # Path to the memory store file (JSONL format)
  store_path: "~/.bxnode-bot/memory.jsonl"
  # Maximum number of results to return from search
  max_results: 5
  # Default TTL for memories in days (0 = no expiry)
  ttl_days: 90

# Plugin configurations (native Rust plugins)
plugins:
  enabled: []
  settings: {}

# Skills configuration (OpenClaw/Agent Skills)
# Skills provide Markdown-based instructions that guide agent behavior.
# See: https://agentskills.io/specification
skills:
  # Enable/disable the skills system
  enabled: true

  # Directories to scan for skills
  # Skills are folders containing a SKILL.md file
  directories:
    - "~/.bxnode/skills"    # Global skills
    - "./skills"            # Workspace skills (higher priority)

  # Skills to explicitly enable (empty = all discovered skills)
  enabled_skills: []

  # Skills to explicitly disable
  disabled_skills: []

  # Sources to sync skills from (use `bxnode-bot skill sync`)
  sync_sources: []
    # Example: sync from awesome-openclaw-skills
    # - repo: "VoltAgent/awesome-openclaw-skills"
    #   branch: "main"
    #
    # Example: sync specific skills from a repository
    # - repo: "openclaw/skills"
    #   path: "skills"
    #   skills:
    #     - "debug-pro"
    #     - "code-review"
