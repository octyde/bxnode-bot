# BXNode Bot Configuration Example
# Copy this file to config.yaml and fill in your values

server:
  host: "0.0.0.0"
  port: 3000
  cors: true

agents:
  defaults:
    model: "anthropic/claude-3-opus"
    # image_model: "openai/gpt-4-vision"

# Channel configurations (uncomment to enable)
channels:
  # telegram:
  #   token: "YOUR_BOT_TOKEN"
  #   allowed_users: []  # Empty = allow all

  # discord:
  #   token: "YOUR_BOT_TOKEN"
  #   allowed_guilds: []

  # slack:
  #   bot_token: "xoxb-YOUR-BOT-TOKEN"
  #   app_token: "xapp-YOUR-APP-TOKEN"

  # line:
  #   channel_access_token: "YOUR_CHANNEL_ACCESS_TOKEN"
  #   channel_secret: "YOUR_CHANNEL_SECRET"
  #   allowed_users: []  # Empty = allow all

  # signal:
  #   api_url: "http://localhost:8080"  # signal-cli-rest-api URL
  #   phone_number: "+1234567890"
  #   allowed_numbers: []  # Empty = allow all

  # feishu:
  #   app_id: "YOUR_APP_ID"
  #   app_secret: "YOUR_APP_SECRET"
  #   verification_token: "YOUR_VERIFICATION_TOKEN"
  #   allowed_users: []  # Empty = allow all

# Provider configurations
providers:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    # base_url: "https://api.anthropic.com"  # Optional

  openai:
    api_key: "${OPENAI_API_KEY}"
    # base_url: "https://api.openai.com"  # Optional
    # organization: "org-xxx"  # Optional

  ollama:
    base_url: "http://localhost:11434"

  # Z.AI (Zhipu GLM) - https://open.bigmodel.cn/
  # zai:
  #   api_key: "${ZAI_API_KEY}"
  #   # base_url: "https://api.z.ai/api/coding/paas/v4"  # Default: Coding Plan endpoint (recommended)
  #   # For standard API use: "https://api.z.ai/api/paas/v4"

  # Groq - https://console.groq.com/
  # groq:
  #   api_key: "${GROQ_API_KEY}"
  #   # base_url: "https://api.groq.com/openai/v1"  # Optional

  # DeepSeek - https://platform.deepseek.com/
  # deepseek:
  #   api_key: "${DEEPSEEK_API_KEY}"
  #   # base_url: "https://api.deepseek.com"  # Optional

  # Mistral - https://console.mistral.ai/
  # mistral:
  #   api_key: "${MISTRAL_API_KEY}"
  #   # base_url: "https://api.mistral.ai/v1"  # Optional

  # Venice.ai - https://venice.ai/
  # venice:
  #   api_key: "${VENICE_API_KEY}"
  #   # base_url: "https://api.venice.ai/api/v1"  # Optional

  # Qwen (Alibaba DashScope) - https://dashscope.console.aliyun.com/
  # qwen:
  #   api_key: "${QWEN_API_KEY}"
  #   # base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"  # Optional

  # Google Gemini - https://aistudio.google.com/apikey
  # gemini:
  #   api_key: "${GEMINI_API_KEY}"
  #   # base_url: "https://generativelanguage.googleapis.com/v1beta/openai"  # Optional

# Workspace configuration for coding projects
workspace:
  # Base directory for all project workspaces
  base_dir: "~/projects"
  # Enable coding tools (file read/write, search) by default for new projects
  coding_tools_enabled: true
  # Enable shell command execution by default for new projects (use with caution)
  shell_enabled: false
  # Paths that should never be accessible (glob patterns)
  blocked_paths:
    - "~/.ssh/*"
    - "~/.gnupg/*"

# Cron scheduler configuration
cron:
  # Enable/disable the cron scheduler
  enabled: true
  # Path to persistent job store
  store_path: "~/.bxnode-bot/cron.json"
  # Jobs defined in config (persistent jobs managed via CLI)
  jobs: []
    # Example job - runs daily at 9 AM UTC
    # - id: "daily-summary"
    #   schedule: "0 0 9 * * *"  # 6-field cron: sec min hour day month weekday
    #   payload:
    #     action: "generate-summary"
    #   description: "Daily morning summary"
    #   enabled: true

# Memory configuration (long-term memory for agents)
memory:
  # Enable/disable the memory system
  enabled: true
  # Path to the memory store file (JSONL format)
  store_path: "~/.bxnode-bot/memory.jsonl"
  # Maximum number of results to return from search
  max_results: 5
  # Default TTL for memories in days (0 = no expiry)
  ttl_days: 90

# Tool configurations
tools:
  web:
    search:
      # Search provider: "brave" or "perplexity"
      # provider: "brave"
      # api_key: "${BRAVE_SEARCH_API_KEY}"
  tts:
    # OpenAI TTS API for text-to-speech
    # api_key: "${OPENAI_API_KEY}"
    # base_url: "https://api.openai.com/v1"  # Optional

# Session management
session:
  # Idle session context TTL in minutes (0 = no eviction)
  idle_ttl_minutes: 30

# Rate limiting (per-chat fixed window)
rate_limit:
  # Maximum messages per minute per chat (0 = no limit)
  max_turns_per_minute: 20

# Channel bindings — override model/project per chat
# channel_bindings:
#   - channel: telegram
#     chat_id: "-1001234567890"
#     project: my-project
#     model: anthropic/claude-sonnet
#     tool_profile: coding

# Plugin configurations (native Rust plugins)
plugins:
  enabled: []
  settings: {}

# Skills configuration (OpenClaw/Agent Skills)
# Skills provide Markdown-based instructions that guide agent behavior.
# See: https://agentskills.io/specification
skills:
  # Enable/disable the skills system
  enabled: true

  # Directories to scan for skills
  # Skills are folders containing a SKILL.md file
  directories:
    - "~/.bxnode/skills"    # Global skills
    - "./skills"            # Workspace skills (higher priority)

  # Skills to explicitly enable (empty = all discovered skills)
  enabled_skills: []

  # Skills to explicitly disable
  disabled_skills: []

  # Sources to sync skills from (use `bxnode-bot skill sync`)
  sync_sources: []
    # Example: sync from awesome-openclaw-skills
    # - repo: "VoltAgent/awesome-openclaw-skills"
    #   branch: "main"
    #
    # Example: sync specific skills from a repository
    # - repo: "openclaw/skills"
    #   path: "skills"
    #   skills:
    #     - "debug-pro"
    #     - "code-review"
