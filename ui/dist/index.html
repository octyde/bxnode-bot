<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BXNode Bot - Control Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 20px;
      margin-bottom: 2rem;
    }
    .status.running::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    .status.stopped::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      margin-right: 8px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .info {
      color: #888;
      font-size: 0.9rem;
      line-height: 1.8;
    }
    .controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.primary {
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      color: #fff;
    }
    button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .endpoints {
      margin-top: 2rem;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .endpoints code {
      color: #00d4ff;
    }
    #version {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BXNode Bot</h1>
    <div id="status" class="status running">Server Running</div>
    <p class="info">
      AI Agent Gateway with Multi-Platform Messaging Support
    </p>
    <div class="controls">
      <button id="startBtn" class="primary" disabled>Start Server</button>
      <button id="stopBtn" class="secondary">Stop Server</button>
    </div>
    <div class="endpoints">
      <strong>API Endpoints:</strong><br><br>
      <code>GET  /health</code> - Health check<br>
      <code>GET  /v1/models</code> - List models<br>
      <code>POST /v1/chat/completions</code> - Chat API<br>
      <code>WS   /ws</code> - WebSocket RPC
    </div>
    <div id="version">Version: 0.1.0</div>
  </div>

  <script>
    // Check if running in Tauri
    const isTauri = window.__TAURI__ !== undefined;

    async function updateStatus() {
      if (isTauri) {
        try {
          const result = await window.__TAURI__.core.invoke('get_status');
          const status = JSON.parse(result);
          document.getElementById('version').textContent = `Version: ${status.version}`;
        } catch (e) {
          console.error('Failed to get status:', e);
        }
      }
    }

    async function startServer() {
      if (isTauri) {
        try {
          await window.__TAURI__.core.invoke('start_server', { port: 3000 });
          document.getElementById('status').className = 'status running';
          document.getElementById('status').textContent = 'Server Running';
          document.getElementById('startBtn').disabled = true;
          document.getElementById('stopBtn').disabled = false;
        } catch (e) {
          console.error('Failed to start server:', e);
        }
      }
    }

    async function stopServer() {
      if (isTauri) {
        try {
          await window.__TAURI__.core.invoke('stop_server');
          document.getElementById('status').className = 'status stopped';
          document.getElementById('status').textContent = 'Server Stopped';
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
        } catch (e) {
          console.error('Failed to stop server:', e);
        }
      }
    }

    document.getElementById('startBtn').addEventListener('click', startServer);
    document.getElementById('stopBtn').addEventListener('click', stopServer);

    // Initialize
    updateStatus();
  </script>
</body>
</html>
