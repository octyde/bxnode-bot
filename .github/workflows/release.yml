name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build CLI binary for Linux, macOS, and Windows
  # ──────────────────────────────────────────────────────────────
  build-cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bxnode-bot-linux-amd64
            binary: target/x86_64-unknown-linux-gnu/release/bxnode-bot
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bxnode-bot-darwin-arm64
            binary: target/aarch64-apple-darwin/release/bxnode-bot
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bxnode-bot-windows-amd64.exe
            binary: target/x86_64-pc-windows-msvc/release/bxnode-bot.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cli-${{ matrix.target }}-

      - name: Build CLI binary
        run: cargo build --release --features full --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ──────────────────────────────────────────────────────────────
  # Job 2: Build Tauri desktop app for Linux, macOS, and Windows
  # ──────────────────────────────────────────────────────────────
  build-tauri:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tauri-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: tauri-${{ matrix.target }}-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # ──────────────────────────────────────────────────────────────
  # Job 3: Create GitHub Release with all artifacts
  # ──────────────────────────────────────────────────────────────
  release:
    needs: [build-cli, build-tauri]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          # CLI binaries
          cp artifacts/bxnode-bot-linux-amd64/bxnode-bot-linux-amd64 release/
          cp artifacts/bxnode-bot-darwin-arm64/bxnode-bot-darwin-arm64 release/
          cp artifacts/bxnode-bot-windows-amd64.exe/bxnode-bot-windows-amd64.exe release/
          # Tauri bundles
          cp artifacts/tauri-linux/* release/ 2>/dev/null || true
          cp artifacts/tauri-macos/* release/ 2>/dev/null || true
          cp artifacts/tauri-windows/* release/ 2>/dev/null || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
