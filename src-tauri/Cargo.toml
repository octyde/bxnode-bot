[package]
name = "bxnode-bot-desktop"
version = "0.1.0"
edition = "2021"
description = "BXNode Bot Desktop Application"
license = "MIT"

[lib]
name = "bxnode_bot_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reference the main bxnode-bot library
bxnode-bot = { path = ".." }
tokio = { version = "1", features = ["full"] }
