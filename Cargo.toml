[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "bxnode-bot"
version = "0.1.0"
edition = "2021"
description = "BXNode Bot - AI agent gateway with multi-platform messaging support"
license = "MIT"
keywords = ["ai", "agent", "gateway", "llm", "chatbot"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
json5 = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment
dotenvy = "0.15"

# File watching
notify = "7.0"

# Cron scheduling
cron = "0.15"

# Embedded assets (for UI)
rust-embed = "8.5"
mime_guess = "2.0"

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Directory utilities
dirs = "6.0"

# Regex for skill sync parsing
regex = "1.10"

# Skillgen dependencies
walkdir = "2.4"
glob = "0.3"

# Channel integrations (feature-gated)
teloxide = { version = "0.14", optional = true, default-features = false, features = ["macros", "ctrlc_handler"] }
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "model", "native_tls_backend"] }

# URL encoding for Signal API
urlencoding = "2.1"

[features]
default = ["channels-core"]
channels-core = []
channel-telegram = ["teloxide"]
channel-discord = ["serenity"]
channel-slack = []
channel-line = []
channel-signal = []
channel-feishu = []
full = ["channel-telegram", "channel-discord", "channel-slack", "channel-line", "channel-signal", "channel-feishu"]

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "bxnode-bot"
path = "src/main.rs"
